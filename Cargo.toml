[workspace]
members = [".", "builder", "ui", "store"]

[package]
name = "stepwise"
version = "0.1.0"
edition = "2021"
description = "Spec-driven API server: every endpoint is a state machine of steps"

[dependencies]
axum = "0.7"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jsonschema = { version = "0.17", default-features = false }
jsonwebtoken = "9"
regex = "1"
matchit = "0.7"
arc-swap = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
form_urlencoded = "1"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
wasmtime = { version = "=43.0.2", default-features = false, features = ["cranelift", "component-model", "component-model-async", "async", "pooling-allocator", "runtime", "std", "wat", "parallel-compilation"] }
wasmtime-wasi = "=43.0.2"
stepwise-store = { path = "store" }
sha2 = "0.10"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
stepwise-builder = { path = "builder" }
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile = "3"

# Dependencies are optimised even in dev builds: Cranelift compiling a JS/Python component
# is unusably slow at opt-level 0. Our own crate stays at 0 for fast edit/compile cycles.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.stepwise]
debug = 0

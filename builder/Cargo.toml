[package]
name = "stepwise-builder"
version = "0.1.0"
edition = "2021"
description = "Turns JS/TS/Python hook source into WebAssembly components for Stepwise"

[lib]
name = "stepwise_builder"
path = "src/lib.rs"

[[bin]]
name = "stepwise-builder"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
percent-encoding = "2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
